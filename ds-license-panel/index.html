<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS License Portal - Verifikasi & Admin Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-input { background: rgba(3, 7, 18, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-input:focus { border-color: rgba(99, 102, 241, 0.8); box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-16 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-950/40 via-slate-950 to-slate-950">

    <header class="glass-panel border-b border-white/5 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 text-white font-black px-3 py-2 rounded-xl text-sm shadow-lg shadow-indigo-500/30">DS</div>
                <div>
                    <h1 class="font-bold text-sm text-white">DS License Portal</h1>
                    <p class="text-[11px] text-indigo-300">Sistem Lisensi Resmi</p>
                </div>
            </div>
            <button onclick="toggleAdminModal()" class="px-3.5 py-1.5 bg-white/5 hover:bg-white/10 text-xs font-semibold rounded-xl text-slate-300 border border-white/10 transition">Admin Login</button>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-6 mt-16 space-y-8">
        <div class="glass-panel rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            <div class="text-center space-y-2 mb-8">
                <h2 class="text-2xl font-black text-white">Cek Status Lisensi</h2>
                <p class="text-xs text-slate-400">Masukkan Username Roblox untuk memeriksa masa aktif lisensi.</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="buyerUsername" placeholder="Username Roblox Kamu" class="w-full px-4 py-3.5 glass-input rounded-2xl text-sm text-white focus:outline-none">
                <button onclick="buyerCheckStatus()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3.5 rounded-2xl text-sm shadow-xl">Cek Lisensi</button>
                <div id="buyerResult" class="hidden p-4 rounded-2xl glass-input text-xs space-y-2 mt-4"></div>
            </div>
        </div>
    </main>

    <!-- ADMIN MODAL -->
    <div id="adminModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-4xl w-full rounded-3xl p-6 md:p-8 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-white/5 pb-4">
                <h3 class="font-bold text-white text-lg">Admin Dashboard</h3>
                <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-white text-sm px-3 py-1 bg-white/5 rounded-xl">Tutup</button>
            </div>

            <div id="adminAuthBox" class="space-y-4 py-4">
                <p class="text-xs text-slate-400">Masukkan API Secret:</p>
                <div class="flex space-x-3">
                    <input type="password" id="modalSecretInput" placeholder="API_SECRET..." class="w-full px-4 py-3 glass-input rounded-xl text-sm text-white focus:outline-none">
                    <button onclick="unlockAdmin()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl">Buka</button>
                </div>
                <p id="authError" class="text-xs text-rose-400 font-semibold"></p>
            </div>

            <div id="adminDashboardContent" class="hidden space-y-6">
                <div class="grid grid-cols-3 gap-4">
                    <div class="glass-panel p-4 rounded-2xl"><p class="text-[11px] text-slate-400">Total</p><h4 id="statTotal" class="text-2xl font-black text-white">0</h4></div>
                    <div class="glass-panel p-4 rounded-2xl"><p class="text-[11px] text-slate-400">Aktif</p><h4 id="statActive" class="text-2xl font-black text-emerald-400">0</h4></div>
                    <div class="glass-panel p-4 rounded-2xl"><p class="text-[11px] text-slate-400">Expired</p><h4 id="statExpired" class="text-2xl font-black text-rose-400">0</h4></div>
                </div>

                <div class="glass-panel p-5 rounded-2xl space-y-4">
                    <h4 class="text-xs font-bold uppercase text-white">Buat Lisensi Baru</h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <input type="text" id="newKey" placeholder="DS-KEY-XXXX" class="px-3 py-2 glass-input rounded-xl text-xs text-white font-mono">
                        <input type="text" id="newOwner" placeholder="Username Roblox" class="px-3 py-2 glass-input rounded-xl text-xs text-white">
                        <input type="date" id="newExpire" class="px-3 py-2 glass-input rounded-xl text-xs text-slate-300">
                    </div>
                    <button onclick="createLicense()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-semibold">Simpan Lisensi</button>
                    <p id="createMsg" class="text-xs text-center"></p>
                </div>

                <div class="space-y-3">
                    <h4 class="text-xs font-bold uppercase text-white">Database Records</h4>
                    <div class="overflow-x-auto rounded-xl border border-white/5 max-h-60 overflow-y-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-white/5 text-slate-400 uppercase">
                                <tr><th class="py-2 px-3">Key</th><th class="py-2 px-3">Owner</th><th class="py-2 px-3">Status</th><th class="py-2 px-3">Expires</th></tr>
                            </thead>
                            <tbody id="licenseTableBody" class="divide-y divide-white/5 text-slate-300"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cachedSecret = '';
        async function buyerCheckStatus() {
            const username = document.getElementById('buyerUsername').value.trim();
            const resBox = document.getElementById('buyerResult');
            if (!username) return alert('Masukkan username!');
            resBox.classList.remove('hidden');
            resBox.innerHTML = 'Mencari...';
            try {
                const res = await fetch('/api/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ owner_name: username }) });
                const data = await res.json();
                if (data.success) {
                    resBox.innerHTML = `<div class="text-emerald-400 font-bold">AKTIF</div><div><b>Key:</b> ${data.data.key}</div><div><b>Expires:</b> ${data.data.expires_at || 'Permanent'}</div>`;
                } else {
                    resBox.innerHTML = `<span class="text-rose-400">Tidak ditemukan.</span>`;
                }
            } catch(e) { resBox.innerHTML = `<span class="text-rose-400">Gagal terhubung server.</span>`; }
        }
        function toggleAdminModal() { document.getElementById('adminModal').classList.toggle('hidden'); }
        async function unlockAdmin() {
            const secret = document.getElementById('modalSecretInput').value.trim();
            const res = await fetch('/api/licenses', { headers: { 'x-api-secret': secret } });
            const data = await res.json();
            if (data.success) {
                cachedSecret = secret;
                document.getElementById('adminAuthBox').classList.add('hidden');
                document.getElementById('adminDashboardContent').classList.remove('hidden');
                renderTable(data.licenses);
            } else { document.getElementById('authError').innerText = data.message; }
        }
        function renderTable(licenses) {
            document.getElementById('statTotal').innerText = licenses.length;
            const tbody = document.getElementById('licenseTableBody');
            tbody.innerHTML = licenses.map(l => `<tr class="hover:bg-white/5"><td class="py-2 px-3 font-mono text-indigo-300">${l.license_key}</td><td class="py-2 px-3">${l.owner_name}</td><td class="py-2 px-3">${l.is_active?'Active':'Inactive'}</td><td class="py-2 px-3">${l.expires_at?l.expires_at.split('T')[0]:'Permanent'}</td></tr>`).join('');
        }
        async function createLicense() {
            const license_key = document.getElementById('newKey').value.trim();
            const owner_name = document.getElementById('newOwner').value.trim();
            const expires_at = document.getElementById('newExpire').value || null;
            const res = await fetch('/api/licenses/create', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-secret': cachedSecret }, body: JSON.stringify({ license_key, owner_name, expires_at }) });
            const data = await res.json();
            document.getElementById('createMsg').innerText = data.message;
            if(data.success) { unlockAdmin(); }
        }
    </script>
</body>
</html>
