<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS License Management Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f8f9fa;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: white;
      background-color: #28a745;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>DS License Management</h2>
    
    <div class="form-group">
      <input type="text" id="licenseInput" placeholder="Masukkan Kode Lisensi Baru">
      <button onclick="addLicense()">Tambah Lisensi</button>
    </div>

    <h3>Daftar Lisensi</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Lisensi Key</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="licenseTable">
        <!-- Data lisensi akan dipanggil dari server -->
      </tbody>
    </table>
  </div>

  <script>
    async function loadLicenses() {
      try {
        const res = await fetch('/api/licenses');
        const data = await res.json();
        const tbody = document.getElementById('licenseTable');
        tbody.innerHTML = '';
        data.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.id}</td>
              <td>${item.license_key}</td>
              <td><span class="badge">${item.status}</span></td>
            </tr>
          `;
        });
      } catch (e) {
        console.error('Error loading licenses:', e);
      }
    }

    async function addLicense() {
      const key = document.getElementById('licenseInput').value;
      if (!key) return alert('Lisensi tidak boleh kosong');

      try {
        const res = await fetch('/api/add-license', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });
        const result = await res.json();
        if (result.success) {
          alert('Lisensi berhasil ditambahkan!');
          document.getElementById('licenseInput').value = '';
          loadLicenses();
        } else {
          alert(result.error || 'Gagal menambahkan lisensi');
        }
      } catch (e) {
        alert('Terjadi kesalahan koneksi');
      }
    }

    loadLicenses();
  </script>
</body>
</html>
